<!DOCTYPE html>
<!-- TESTONIC R&D — 3D Print Viewer -->
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="https://airmax.testonic.co.kr/favicon.ico" type="image/x-icon" sizes="16x16">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>TESTONIC 3D Print 멀티 뷰어</title>
</head>
<body>

  <!-- 유기적 배경 장식 -->
  <div class="app-bg" aria-hidden="true">
    <div class="app-bg-shape app-bg-shape--1"></div>
    <div class="app-bg-shape app-bg-shape--2"></div>
    <div class="app-bg-shape app-bg-shape--3"></div>
  </div>

  <!-- ── 헤더 ── -->
  <header class="topbar">
    <div class="topbar-left">
      <h1>3D PRINT <span>멀티 뷰어</span></h1>
      <div class="subtitle">LIVE SNAPSHOT MONITOR</div>
    </div>
    <div class="topbar-right">
      <div id="errorBadgeBtn" class="error-badge-btn">
        <span class="err-badge" id="errorCount">0</span>
        <span>오류</span>
      </div>
<button class="theme-toggle" id="themeToggle">
        <span class="icon" id="themeIcon">🌙</span>
      </button>
    </div>
  </header>

  <!-- ── 에러 리스트 배너 ── -->
  <div id="errorBanner" class="error-banner"></div>

  <!-- ── 팁바 ── -->
  <div class="tip-bar">
    <span class="tip-desktop">💡 카메라 클릭 → 우측 확대 · 방향키 ← / → 이동 · ESC 닫기 · 🔒 핀으로 자동전환 고정</span>
    <span class="tip-mobile">💡 카메라를 탭하면 확대됩니다 · 🔒 핀으로 고정</span>
  </div>

  <!-- ── 메인 ── -->
  <div class="main">

    <aside class="sidebar">
      <div class="sidebar-label">📡 연결된 프린터 — <span id="printerCount">0</span>대</div>
      <div class="grid" id="grid"></div>
    </aside>

    <section class="focus-panel">

      <div class="focus-header hidden" id="focusHeader">
        <div class="focus-header-left">
          <div class="focus-live-dot"></div>
          <span class="focus-title-text" id="focusTitle"></span>
        </div>
        <div class="focus-controls">
          <button class="ctrl-btn" id="pauseResumeBtn"></button>
          <button class="ctrl-btn" id="infoBtn">📋 출력</button>
          <button class="ctrl-btn" id="printFileBtn">🗂 파일</button>
          <button class="ctrl-btn" id="livePipBtn">⧉ PIP</button>
          <button class="ctrl-btn" id="pinBtn">🔒 고정</button>
          <button class="ctrl-btn" id="closeBtn">✕ 닫기</button>
        </div>
      </div>

      <div class="focus-empty" id="focusEmpty">
        <div class="empty-icon">📷</div>
        <div class="empty-text">카메라를 선택하면 여기에 표시됩니다</div>
      </div>

      <div class="focus-body" id="focusBody">
        <img id="focusImg" src="" alt="focus stream" />
        <div class="loading-overlay" id="loadingOverlay">
          <div class="spinner"></div>
          <div class="loading-label">CONNECTING</div>
        </div>
        <div class="print-info-bar" id="printInfoBar"></div>
        <div class="focus-info-panel" id="focusInfoPanel">
          <div class="focus-info-tabs">
            <button class="info-tab active" data-tab="history">📋 출력 히스토리</button>
            <button class="info-tab" data-tab="timelapse">🎬 타임랩스</button>
          </div>
          <div class="info-tab-content" id="historyContent">
            <div class="info-loading">버튼을 눌러 불러옵니다</div>
          </div>
          <div class="info-tab-content hidden" id="timelapseContent">
            <div id="timelapseGrid">
              <div class="info-loading">버튼을 눌러 불러옵니다</div>
            </div>
          </div>
        </div>
      </div>

      <div class="focus-footer hidden" id="focusFooter">
        <span id="focusInfo">—</span>
        <div class="progress-bar-wrap" title="다음 카메라까지 남은 시간">
          <div class="progress-bar" id="progressBar"></div>
        </div>
      </div>

    </section>
  </div>

  <!-- ── 파일 브라우저 모달 ── -->
  <div id="fileModal" class="video-modal">
    <div class="video-modal-overlay" id="fileModalOverlay"></div>
    <div class="video-modal-box file-modal-box">
      <div class="video-modal-header">
        <span class="video-modal-title" id="fileModalTitle">🗂 파일 선택</span>
        <button class="video-modal-close" id="fileModalClose">✕</button>
      </div>
      <div id="fileModalBody" class="file-modal-body">
        <div class="info-loading">불러오는 중…</div>
      </div>
    </div>
  </div>


  <!-- ── 타임랩스 영상 재생 모달 ── -->
  <div id="videoModal" class="video-modal">
    <div class="video-modal-overlay" id="videoModalOverlay"></div>
    <div class="video-modal-box">
      <div class="video-modal-header">
        <span class="video-modal-title" id="videoModalTitle"></span>
        <div style="display:flex;gap:8px;align-items:center;">
          <button class="video-modal-close" id="videoPipBtn" title="PIP 모드">⧉ PIP</button>
          <button class="video-modal-close" id="videoModalClose">✕ 닫기</button>
        </div>
      </div>
      <div class="video-modal-player">
        <video id="videoPlayer" controls autoplay playsinline muted></video>
      </div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>
  <script src="app.js"></script>
</body>
</html>
